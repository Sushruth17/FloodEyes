[project]
name = "floodeyes"
version = "0.1.0"
description = "Flood Eyes backend: live street-level flood depth from crowdsourced photos"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.26",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    "pillow>=11.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
eval = [
    "matplotlib>=3.9",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"../eval/label_server.py" = ["E501"]  # inline HTML/JS page

[tool.pytest.ini_options]
testpaths = ["tests", "../eval/tests"]
pythonpath = [".", ".."]
asyncio_mode = "auto"
